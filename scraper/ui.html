<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TYT Crawl</title>
<style>
  :root{
    --bg:#0f1116; --bg2:#161922; --bg3:#1d212c; --line:#272c38;
    --fg:#e7eaf0; --fg2:#9aa3b5; --fg3:#6b7488;
    --accent:#5b8cff; --accent2:#7c5cff; --ok:#2ec27e; --warn:#f5a623; --err:#f4515d;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.55 "Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
    overflow:hidden;
  }
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;border:none;border-radius:9px;padding:8px 14px;background:var(--bg3);
    border:1px solid var(--line);transition:.15s}
  button:hover:not(:disabled){background:#262b38;border-color:#3a4152}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-weight:600}
  button.primary:hover:not(:disabled){filter:brightness(1.12);background:linear-gradient(135deg,var(--accent),var(--accent2))}
  button.danger{background:#3a1d22;border-color:#5c2b33;color:#ffb3ba}
  button.ghost{background:transparent}
  input,select{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  a{color:var(--accent);text-decoration:none}
  .app{display:flex;height:100vh}

  /* ---------- sidebar ---------- */
  .sidebar{width:340px;min-width:340px;display:flex;flex-direction:column;
    background:var(--bg2);border-right:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;font-weight:700;font-size:16px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .brand .dot.off{background:var(--err);box-shadow:0 0 10px var(--err)}
  .brand small{font-weight:400;color:var(--fg3);font-size:11px;margin-left:auto}
  .tabs{display:flex;gap:4px;padding:0 14px 10px}
  .tabs button{flex:1;background:transparent;border:1px solid transparent;color:var(--fg2);padding:7px 8px;font-size:13px}
  .tabs button.active{background:var(--bg3);border-color:var(--line);color:var(--fg);font-weight:600}
  .searchrow{display:flex;gap:8px;padding:0 14px 10px}
  .searchrow input{flex:1;min-width:0}
  .list{flex:1;overflow-y:auto;padding:0 10px 10px}
  .list::-webkit-scrollbar,.main::-webkit-scrollbar,.chapterlist::-webkit-scrollbar{width:9px}
  .list::-webkit-scrollbar-thumb,.main::-webkit-scrollbar-thumb,.chapterlist::-webkit-scrollbar-thumb{background:#2c323f;border-radius:9px}
  .card{display:flex;gap:11px;padding:9px;border-radius:var(--radius);cursor:pointer;border:1px solid transparent}
  .card:hover{background:var(--bg3)}
  .card.active{background:var(--bg3);border-color:var(--accent)}
  .card img{width:46px;height:62px;border-radius:7px;object-fit:cover;background:var(--bg3);flex:0 0 auto}
  .card .ci{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
  .card .t{font-weight:600;font-size:13.5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .card .m{font-size:11.5px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .m b{color:var(--ok);font-weight:600}
  .more{padding:10px 14px 16px}
  .more button{width:100%}
  .hint{padding:14px;color:var(--fg3);font-size:12.5px;text-align:center}

  /* ---------- main ---------- */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .mainscroll{flex:1;overflow-y:auto;padding:22px 26px 40px}
  .empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--fg3);flex-direction:column;gap:12px}
  .empty .big{font-size:44px;opacity:.5}
  .detail-head{display:flex;gap:20px}
  .cover{width:150px;height:205px;border-radius:12px;object-fit:cover;background:var(--bg3);flex:0 0 auto;box-shadow:0 8px 26px #0007}
  .dhead-info{min-width:0;flex:1}
  .dhead-info h1{margin:0 0 6px;font-size:23px;line-height:1.25}
  .dhead-info .author{color:var(--fg2);margin-bottom:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .chip{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--bg3);border:1px solid var(--line);color:var(--fg2)}
  .chip.ok{color:#8ff0c0;border-color:#1f5c42;background:#12301f}
  .chip.warn{color:#ffd48a;border-color:#5c4a1f;background:#302712}
  .genre{font-size:11.5px;padding:3px 9px;border-radius:6px;background:#1b2740;color:#9db8ee;border:1px solid #26385c}
  .stats{display:flex;gap:18px;color:var(--fg2);font-size:12.5px;margin-bottom:14px;flex-wrap:wrap}
  .stats span b{color:var(--fg);font-weight:600}
  .desc{color:var(--fg2);font-size:13px;border-left:2px solid var(--line);padding-left:12px;margin-bottom:16px;max-height:110px;overflow:hidden;position:relative;white-space:pre-wrap}
  .desc.open{max-height:none}
  .desc i,.desc b{color:var(--fg)}
  .desc .toggle{position:absolute;right:0;bottom:0;background:linear-gradient(90deg,transparent,var(--bg) 30%);padding-left:40px;color:var(--accent);cursor:pointer;font-style:normal}

  .controls{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:18px;
    display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.4px}
  .fld input{width:92px}
  .fld select{width:92px}
  .controls .spacer{flex:1}
  .check{display:flex;align-items:center;gap:7px;color:var(--fg2);font-size:13px;padding-bottom:9px}
  .check input{width:auto}

  .jobbox{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:20px}
  .jobbox.running{border-color:#2b4b8f;box-shadow:0 0 0 1px #2b4b8f33}
  .jobtop{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .jobtop .jt{font-weight:600}
  .jobtop .st{margin-left:auto;font-size:12px;padding:3px 10px;border-radius:20px;background:var(--bg3);color:var(--fg2)}
  .st.running{color:#9db8ee;background:#1b2740}
  .st.done{color:#8ff0c0;background:#12301f}
  .st.error{color:#ffb3ba;background:#3a1d22}
  .st.stopped{color:#ffd48a;background:#302712}
  .bar{height:9px;border-radius:9px;background:var(--bg3);overflow:hidden;margin-bottom:8px}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
  .jobmeta{display:flex;gap:16px;font-size:12.5px;color:var(--fg2);flex-wrap:wrap;margin-bottom:10px}
  .jobmeta b{color:var(--fg)}
  .log{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;max-height:150px;
    overflow-y:auto;font:12px/1.5 ui-monospace,Consolas,monospace;color:var(--fg2);white-space:pre-wrap}
  .log .e{color:#ffb3ba} .log .r{color:#ffd48a}

  .sect-title{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin:22px 0 12px}
  .sect-title .c{color:var(--fg3);font-weight:400;font-size:12.5px}
  .sect-title .r{margin-left:auto;display:flex;gap:8px}
  .chapterlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:7px;max-height:420px;overflow-y:auto;
    background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:10px}
  .chi{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;font-size:12.5px;cursor:pointer;
    border:1px solid transparent;white-space:nowrap;overflow:hidden}
  .chi:hover{background:var(--bg3)}
  .chi.have{color:#c9f7dd}
  .chi.have:hover{border-color:#1f5c42}
  .chi .n{color:var(--fg3);font-weight:600;min-width:38px;font-variant-numeric:tabular-nums}
  .chi .ti{overflow:hidden;text-overflow:ellipsis}
  .chi .dl{margin-left:auto;font-size:10px;color:var(--ok)}

  .reader h2{margin:0 0 4px;font-size:20px}
  .reader .rmeta{color:var(--fg3);font-size:12.5px;margin-bottom:18px;display:flex;gap:14px;align-items:center}
  .reader .rmeta button{padding:5px 11px;font-size:12.5px}
  .content{font-size:15px;line-height:1.85;max-width:760px;color:#d8dde8}
  .content p{margin:0 0 14px}
  .content p:first-letter{}
  .backlink{display:inline-flex;align-items:center;gap:6px;color:var(--fg2);cursor:pointer;margin-bottom:14px;font-size:13px}
  .backlink:hover{color:var(--fg)}
  .toolbar{display:flex;gap:8px;padding:12px 26px;border-top:1px solid var(--line);background:var(--bg2);align-items:center}
  .toolbar .who{color:var(--fg2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:99}
  .toast div{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--accent);
    padding:10px 14px;border-radius:9px;box-shadow:0 10px 30px #0008;font-size:13px;max-width:360px}
  .toast div.err{border-left-color:var(--err)}
  .hidden{display:none !important}
  @media (max-width:820px){
    .sidebar{width:100%;min-width:0;position:absolute;inset:0;z-index:5}
    .sidebar.hide{display:none}
    .detail-head{flex-direction:column}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="dot" id="statusDot"></span> TYT Crawl <small id="deviceInfo">…</small></div>
    <div class="tabs">
      <button data-tab="list" class="active">Khám phá</button>
      <button data-tab="search">Tìm kiếm</button>
      <button data-tab="local">Đã tải</button>
    </div>
    <div class="searchrow hidden" id="searchRow">
      <input id="q" placeholder="Nhập tên truyện rồi Enter…" autocomplete="off">
      <button class="primary" id="btnSearch">Tìm</button>
    </div>
    <div class="list" id="storyList"><div class="hint">Đang tải…</div></div>
    <div class="more hidden" id="moreBox"><button id="btnMore" class="ghost">Tải thêm ↓</button></div>
  </aside>

  <main class="main">
    <div class="mainscroll" id="mainScroll">
      <div class="empty" id="emptyState">
        <div class="big">📚</div>
        <div>Chọn một truyện ở cột bên trái để bắt đầu</div>
      </div>
      <div id="detail" class="hidden"></div>
      <div id="reader" class="hidden"></div>
    </div>
    <div class="toolbar" id="toolbar">
      <button class="ghost" id="btnToggleList">☰ Danh sách</button>
      <span class="who" id="toolbarWho">Sẵn sàng</span>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const fmt = n => (n==null?  "" : Number(n).toLocaleString("vi-VN"));
const cover = u => u ? "/cover?u=" + encodeURIComponent(u) : "";
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const state = {
  tab: "list", offset: 0, count: 24, keyword: "",
  story: null, job: null, poll: null, jobs: {},
  apiChapters: [], apiStart: 0, apiEnd: 0, apiTotal: 0,
  localChapters: [], localMap: new Map(),
  reading: null,
};

/* ---------------- toast ---------------- */
function toast(msg, kind=""){
  const d = document.createElement("div");
  if (kind==="err") d.className="err";
  d.textContent = msg;
  $("#toast").appendChild(d);
  setTimeout(()=>d.remove(), 4200);
}

/* ---------------- api ---------------- */
async function api(path, params){
  const url = new URL(path, location.origin);
  for (const [k,v] of Object.entries(params||{})) if (v!=null) url.searchParams.set(k,v);
  const r = await fetch(url);
  let j;
  try { j = await r.json(); } catch(e){ throw new Error("Server trả về dữ liệu lỗi"); }
  if (!j.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j.data;
}
async function post(path, body){
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body||{})});
  let j; try { j = await r.json(); } catch(e){ throw new Error("Server trả về dữ liệu lỗi"); }
  if (!j.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j.data;
}

/* ---------------- sidebar list ---------------- */
function cardHtml(s){
  const cov = s.cover ? `<img src="${cover(s.cover)}" loading="lazy" onerror="this.style.visibility='hidden'">`
                      : `<img style="visibility:hidden">`;
  return `<div class="card" data-id="${esc(s.id)}">
    ${cov}
    <div class="ci">
      <div class="t">${esc(s.title)}</div>
      <div class="m">${esc(s.author||"Đang cập nhật")}</div>
      <div class="m">${s.have!=null? `<b>${fmt(s.have)}</b>/${fmt(s.chapter_count)} chương đã tải` : `${fmt(s.chapter_count)} chương`}</div>
    </div>
  </div>`;
}
function renderList(items, append){
  const box = $("#storyList");
  if (!append) box.innerHTML = "";
  if (!items.length && !append) { box.innerHTML = `<div class="hint">Không có kết quả</div>`; return; }
  box.insertAdjacentHTML("beforeend", items.map(cardHtml).join(""));
  $$(".card", box).forEach(c => c.onclick = () => { openStory(c.dataset.id); if (innerWidth<=820) $("#sidebar").classList.add("hide"); });
}

async function loadList(reset){
  if (reset){ state.offset = 0; }
  if (state.tab === "search" && !state.keyword){
    $("#storyList").innerHTML = `<div class="hint">Nhập tên truyện rồi bấm “Tìm”.</div>`;
    $("#moreBox").classList.add("hidden");
    return;
  }
  const path = state.tab === "search" ? "/api/search" : "/api/list";
  const items = await api(path, {count: state.count, offset: state.offset, keyword: state.keyword});
  if (reset) $("#storyList").innerHTML = "";
  renderList(items, !reset);
  state.offset += items.length;
  $("#moreBox").classList.toggle("hidden", items.length < state.count);
}

async function loadLocal(){
  const items = await api("/api/local");
  const box = $("#storyList");
  box.innerHTML = items.length ? "" : `<div class="hint">Chưa tải truyện nào.<br>Chuyển sang tab “Khám phá”.</div>`;
  box.insertAdjacentHTML("beforeend", items.map(s => {
    const cov = s.cover ? `<img src="${cover(s.cover)}" loading="lazy" onerror="this.style.visibility='hidden'">` : `<img style="visibility:hidden">`;
    return `<div class="card" data-id="${esc(s.story_id)}">${cov}
      <div class="ci">
        <div class="t">${esc(s.title)}</div>
        <div class="m">${esc(s.author||"")}</div>
        <div class="m"><b>${fmt(s.have)}</b>/${fmt(s.chapter_count)} chương · ${(s.bytes/1048576).toFixed(1)} MB</div>
      </div></div>`;
  }).join(""));
  $$(".card", box).forEach(c => c.onclick = () => { openStory(c.dataset.id, true); if (innerWidth<=820) $("#sidebar").classList.add("hide"); });
  $("#moreBox").classList.add("hidden");
}

/* ---------------- story detail ---------------- */
async function openStory(id, localOnly){
  $("#emptyState").classList.add("hidden");
  $("#reader").classList.add("hidden");
  $("#detail").classList.remove("hidden");
  $("#detail").innerHTML = `<div class="empty"><div class="big">⏳</div><div>Đang tải…</div></div>`;
  $$(".card").forEach(c => c.classList.toggle("active", c.dataset.id === id));
  let s;
  try { s = await api("/api/story", {id}); }
  catch(e){ $("#detail").innerHTML = `<div class="empty"><div class="big">⚠</div><div>${esc(e.message)}</div></div>`; return; }
  state.story = s;
  state.apiChapters = []; state.apiStart = 0; state.apiEnd = 0;
  state.localChapters = []; state.localMap = new Map();
  renderDetail(s);
  $("#toolbarWho").textContent = s.title;
  loadLocalChapters(id);
  loadApiChapters(s.id, 1);
}

function renderDetail(s){
  const g = s.genre || [];
  const local = s.local || {have:0};
  const has = (s.desc_text || "").length > 220;
  $("#detail").innerHTML = `
  <div class="detail-head">
    ${s.cover ? `<img class="cover" src="${cover(s.cover)}" onerror="this.style.visibility='hidden'">` : ""}
    <div class="dhead-info">
      <h1>${esc(s.title)}</h1>
      <div class="author">✍ ${esc(s.author||"Đang cập nhật")}</div>
      <div class="chips">
        <span class="chip ${s.status_full?'ok':'warn'}">${s.status_full?"Full":"Đang ra"}</span>
        <span class="chip">${fmt(s.chapter_count)} chương</span>
        ${s.have? `<span class="chip ok">đã tải ${fmt(local.have)}</span>`:""}
        ${s.source? `<span class="chip">${esc(s.source)}</span>`:""}
      </div>
      <div class="stats">
        <span>👁 <b>${fmt(s.view_count)}</b></span>
        <span>❤ <b>${fmt(s.like_count)}</b></span>
        <span>⭐ <b>${fmt(s.star)}</b></span>
      </div>
      <div class="chips">${g.map(t=>`<span class="genre">${esc(t)}</span>`).join("")}</div>
      <div class="desc ${has?"":"open"}" id="descBox">${s.desc || ""}${has?`<span class="toggle">Xem thêm</span>`:""}</div>
    </div>
  </div>

  <div class="controls">
    <div class="fld"><label>Số chương</label><input id="inMax" type="number" min="0" value="0" title="0 = tải tất cả"></div>
    <div class="fld"><label>Delay (giây)</label>
      <select id="inDelay">
        <option value="0.8">0.8</option>
        <option value="1.0" selected>1.0</option>
        <option value="1.5">1.5</option>
        <option value="2.0">2.0</option>
        <option value="3.0">3.0</option>
      </select></div>
    <div class="fld"><label>Thử lại</label><input id="inRetries" type="number" min="0" max="20" value="6"></div>
    <label class="check"><input type="checkbox" id="inResume" checked> Bỏ qua chương đã có</label>
    <div class="spacer"></div>
    <button class="primary" id="btnCrawl">⬇ Bắt đầu crawl</button>
    <button class="danger hidden" id="btnStop">⏹ Dừng</button>
    <button id="btnTxt">.txt</button>
    <button id="btnJsonl">.jsonl</button>
  </div>

  <div id="jobBox"></div>

  <div class="sect-title">Chương đã tải <span class="c" id="localCount"></span>
    <span class="r"><button class="ghost" id="btnReloadLocal">↻ Làm mới</button></span></div>
  <div class="chapterlist" id="localList"><div class="hint">Chưa có chương nào</div></div>

  <div class="sect-title">Tất cả chương <span class="c" id="apiCount"></span>
    <span class="r"><button class="ghost hidden" id="btnMoreCh">Tải thêm chương ↓</button></span></div>
  <div class="chapterlist" id="apiList"><div class="hint">Đang tải…</div></div>
  `;
  const d = $("#descBox");
  if (d && d.querySelector(".toggle"))
    d.querySelector(".toggle").onclick = e => { e.stopPropagation(); d.classList.add("open"); d.querySelector(".toggle").remove(); };

  $("#btnCrawl").onclick = () => startCrawl();
  $("#btnStop").onclick = () => stopJob();
  $("#btnTxt").onclick = () => download("txt");
  $("#btnJsonl").onclick = () => download("jsonl");
  $("#btnMoreCh").onclick = () => loadApiChapters(s.id, state.apiEnd + 1);
  $("#btnReloadLocal").onclick = () => loadLocalChapters(s.id, true);
  if (!(s.local && s.local.have)){ $("#btnTxt").disabled = true; $("#btnJsonl").disabled = true; }
}

function download(fmt){
  if (!state.story) return;
  location.href = `/download?id=${encodeURIComponent(state.story.id)}&format=${fmt}`;
}

/* ---------------- chapters ---------------- */
async function loadLocalChapters(id, refresh){
  try {
    const list = await api("/api/local_chapters", {id});
    state.localChapters = list;
    state.localMap = new Map(list.map(c => [c.number, c]));
    renderLocal();
    if (refresh && state.story && state.story.id === id){
      const s = await api("/api/story", {id});
      state.story.local = s.local; state.story.have = s.have;
      const cc = $("#localCount"); if (cc) cc.textContent = `· ${fmt(list.length)} chương`;
    }
  } catch(e){ /* im lặng */ }
}

function renderLocal(){
  const box = $("#localList"); if (!box) return;
  const list = state.localChapters;
  $("#localCount").textContent = `· ${fmt(list.length)} chương`;
  if (!list.length){ box.innerHTML = `<div class="hint">Chưa có chương nào — bấm “Bắt đầu crawl”.</div>`; return; }
  box.innerHTML = list.map(c => `<div class="chi have" data-n="${c.number}"><span class="n">#${c.number}</span>
      <span class="ti">${esc(c.title||"")}</span><span class="dl">✓</span></div>`).join("");
  $$(".chi", box).forEach(el => el.onclick = () => openChapter(+el.dataset.n));
}

async function loadApiChapters(id, start){
  $("#apiList").innerHTML = `<div class="hint">Đang tải…</div>`;
  try {
    const chunks = [];
    for (let k = 0; k < 2; k++){
      const s = start + k*50;
      const part = await api("/api/chapters", {id, start: s, end: s+49});
      if (!part.length) break;
      chunks.push(...part);
      if (part.length < 50) break;
    }
    const items = chunks;
    if (start === 1){ state.apiChapters = items; } else { state.apiChapters = state.apiChapters.concat(items); }
    state.apiEnd = items.length ? items[items.length-1].number : state.apiEnd;
    renderApi();
  } catch(e){
    $("#apiList").innerHTML = `<div class="hint">${esc(e.message)}</div>`;
  }
}

function renderApi(){
  const box = $("#apiList");
  const list = state.apiChapters;
  $("#apiCount").textContent = `· đã xem ${fmt(list.length)}/${fmt(state.story.chapter_count)}`;
  box.innerHTML = list.map(c => {
    const have = state.localMap.has(c.number);
    return `<div class="chi ${have?"have":""}" data-n="${c.number}"><span class="n">#${c.number}</span>
      <span class="ti">${esc((c.title||"").replace(/^Chương\s*\d+\s*:?\s*/i,""))}</span>${have?`<span class="dl">✓</span>`:""}</div>`;
  }).join("");
  $$(".chi", box).forEach(el => el.onclick = () => openChapter(+el.dataset.n));
  $("#btnMoreCh").classList.toggle("hidden", list.length >= state.story.chapter_count);
}

/* ---------------- reader ---------------- */
async function openChapter(number){
  const s = state.story; if (!s) return;
  const have = state.localMap.has(number);
  if (!have){ toast("Chương " + number + " chưa được tải. Hãy crawl trước.", "err"); return; }
  try {
    const c = await api("/api/read", {id: s.id, number});
    state.reading = number;
    $("#detail").classList.add("hidden");
    $("#reader").classList.remove("hidden");
    const idx = state.localChapters.findIndex(x => x.number === number);
    const prev = idx > 0 ? state.localChapters[idx-1].number : null;
    const next = idx >= 0 && idx < state.localChapters.length-1 ? state.localChapters[idx+1].number : null;
    const paras = (c.content || "").split(/\n+/).map(t => t.trim()).filter(Boolean)
      .map(t => `<p>${esc(t)}</p>`).join("") || "<p>(Chương trống)</p>";
    $("#reader").innerHTML = `
      <span class="backlink" id="btnBack">← Quay lại ${esc(s.title)}</span>
      <div class="reader">
        <h2>${esc(c.title || ("Chương " + number))}</h2>
        <div class="rmeta">
          <button id="btnPrev" ${prev==null?"disabled":""}>‹ Trước</button>
          <button id="btnNext" ${next==null?"disabled":""}>Sau ›</button>
          <span>#${number} / ${fmt(s.chapter_count)}</span>
        </div>
        <div class="content">${paras}</div>
      </div>`;
    $("#btnBack").onclick = backToDetail;
    $("#btnPrev").onclick = () => prev!=null && openChapter(prev);
    $("#btnNext").onclick = () => next!=null && openChapter(next);
    $("#toolbarWho").textContent = `${s.title} — ${c.title||("Chương "+number)}`;
    $("#mainScroll").scrollTop = 0;
  } catch(e){ toast(e.message, "err"); }
}
function backToDetail(){
  $("#reader").classList.add("hidden");
  $("#detail").classList.remove("hidden");
  if (state.story) $("#toolbarWho").textContent = state.story.title;
}

/* ---------------- crawl job ---------------- */
async function startCrawl(){
  const s = state.story; if (!s) return;
  const body = {
    story_id: s.id, title: s.title,
    max_chapters: Number($("#inMax").value||0),
    delay: Number($("#inDelay").value||1),
    retries: Number($("#inRetries").value||6),
    resume: $("#inResume").checked,
  };
  try {
    const r = await post("/api/crawl", body);
    toast("Đã bắt đầu crawl: " + s.title);
    pollJob(r.job_id);
  } catch(e){ toast(e.message, "err"); }
}
async function stopJob(){
  const id = state.job && state.job.id; if (!id) return;
  try { await post("/api/stop", {job_id: id}); } catch(e){ toast(e.message,"err"); }
}
function pollJob(id){
  if (state.poll) clearInterval(state.poll);
  state.jobId = id;
  const tick = async () => {
    try {
      const job = await api("/api/job", {id: state.jobId});
      if (!job){ clearInterval(state.poll); return; }
      state.job = job;
      renderJob(job);
      if (["done","error","stopped"].includes(job.status)){
        clearInterval(state.poll); state.poll = null;
        $("#btnCrawl").disabled = false; $("#btnStop").classList.add("hidden");
        if (state.story && state.story.id === job.story_id) loadLocalChapters(state.story.id, true);
        if (state.tab === "local") loadLocal();
        if (job.status === "done") toast("Crawl xong: " + fmt(job.written) + " chương mới");
      }
    } catch(e){ /* thu lai */ }
  };
  tick();
  state.poll = setInterval(tick, 900);
}

function renderJob(job){
  const box = $("#jobBox"); if (!box) return;
  const total = job.total || 0;
  const pct = total ? Math.min(100, (job.have/total)*100) : (job.status==="running" ? 3 : 0);
  const label = {running:"Đang chạy", done:"Hoàn tất", error:"Lỗi", stopped:"Đã dừng"}[job.status] || job.status;
  const logs = job.log.slice(-40).map(l => {
    const cls = l.startsWith("⚠") ? "e" : (l.startsWith("⏳") ? "r" : "");
    return `<span class="${cls}">${esc(l)}</span>`;
  }).join("\n");
  box.innerHTML = `
  <div class="jobbox ${job.status==="running"?"running":""}">
    <div class="jobtop">
      <span class="jt">${esc(job.title||job.story_id)}</span>
      <span class="st ${job.status}">${label}</span>
    </div>
    <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
    <div class="jobmeta">
      <span>Đã tải <b>${fmt(job.have)}</b>/${fmt(total)} chương</span>
      <span>Phiên này <b>${fmt(job.written)}</b></span>
      <span>~<b>${fmt(job.chars)}</b> ký tự</span>
      ${job.current? `<span>đang lấy: <b>#${job.current.number}</b> ${esc(job.current.title||"")}</span>`:""}
    </div>
    <div class="log" id="jobLog">${logs}</div>
  </div>`;
  const lg = $("#jobLog"); if (lg) lg.scrollTop = lg.scrollHeight;
  $("#btnCrawl").disabled = job.status === "running";
  $("#btnStop").classList.toggle("hidden", job.status !== "running");
}

/* ---------------- tabs ---------------- */
$$(".tabs button").forEach(b => b.onclick = () => {
  $$(".tabs button").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  state.tab = b.dataset.tab;
  $("#searchRow").classList.toggle("hidden", state.tab !== "search");
  if (state.tab === "local") loadLocal();
  else loadList(true);
});
$("#btnSearch").onclick = () => { state.keyword = $("#q").value.trim(); loadList(true); };
$("#q").addEventListener("keydown", e => { if (e.key === "Enter"){ state.keyword = $("#q").value.trim(); loadList(true); } });
$("#btnMore").onclick = () => loadList(false);
$("#btnToggleList").onclick = () => $("#sidebar").classList.toggle("hide");

/* ---------------- boot ---------------- */
(async () => {
  try {
    const cfg = await api("/api/config");
    $("#deviceInfo").textContent = "local";
    if (cfg.active_job) pollJob(cfg.active_job);
  } catch(e){
    $("#statusDot").classList.add("off");
    toast("Không kết nối được server: " + e.message, "err");
  }
  loadList(true).catch(e => toast(e.message, "err"));
})();
</script>
</body>
</html>
