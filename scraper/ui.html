<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TYT Crawl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
  /* Bảng màu: giấy xám-lục, mực, ngọc (jade) cho "đã có", hổ phách cho "sẽ tải". */
  :root{
    --paper:#e8ece6; --surface:#f4f6f1; --raised:#fcfdfb;
    --line:#d1d8cf; --line2:#b5c0b4;
    --ink:#1a2521; --ink2:#4a5953; --ink3:#76857e;
    --jade:#1d7a62; --jade-hi:#0f4d3d; --jade-wash:#d3e8de; --on-jade:#fff;
    --amber:#d49a24; --amber-wash:#f5e5c0;
    --brick:#ad3f2c; --brick-wash:#f4dad3;
    --cell-empty:#d8dfd5; --cell-skip:#7db9a4;
    --ui:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;
    --serif:"Literata",Georgia,"Times New Roman",serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0e1512; --surface:#151e1a; --raised:#1b2621;
      --line:#25312b; --line2:#35453d;
      --ink:#e3ebe6; --ink2:#a2b2aa; --ink3:#72837b;
      --jade:#4cc19b; --jade-hi:#2f9b7c; --jade-wash:#17342b; --on-jade:#082018;
      --amber:#e3aa3d; --amber-wash:#3a2f14;
      --brick:#ee7b66; --brick-wash:#3a1e19;
      --cell-empty:#27352e; --cell-skip:#2f7b64;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0e1512; --surface:#151e1a; --raised:#1b2621;
    --line:#25312b; --line2:#35453d;
    --ink:#e3ebe6; --ink2:#a2b2aa; --ink3:#72837b;
    --jade:#4cc19b; --jade-hi:#2f9b7c; --jade-wash:#17342b; --on-jade:#082018;
    --amber:#e3aa3d; --amber-wash:#3a2f14;
    --brick:#ee7b66; --brick-wash:#3a1e19;
    --cell-empty:#27352e; --cell-skip:#2f7b64;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font:14.5px/1.55 var(--ui);overflow:hidden;
    -webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  a{color:var(--jade)}
  :focus-visible{outline:2px solid var(--jade);outline-offset:2px}
  ::selection{background:var(--jade-wash)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
    padding:7px 13px;border-radius:6px;border:1px solid var(--line2);background:var(--raised);
    font-weight:500;font-size:13.5px;line-height:1.3;white-space:nowrap}
  .btn:hover:not(:disabled){border-color:var(--ink3)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--jade);border-color:var(--jade);color:var(--on-jade);font-weight:600;padding:9px 18px}
  .btn.primary:hover:not(:disabled){background:var(--jade-hi);border-color:var(--jade-hi)}
  .btn.danger{border-color:var(--brick);color:var(--brick);font-weight:600;padding:9px 18px}
  .btn.danger:hover{background:var(--brick-wash)}
  .btn.quiet{background:transparent;border-color:transparent;color:var(--ink2)}
  .btn.quiet:hover:not(:disabled){color:var(--ink);border-color:var(--line2)}
  .btn.sm{padding:4px 10px;font-size:12.5px}
  input[type=number],input[type=search],input[type=text],select{
    background:var(--raised);border:1px solid var(--line2);border-radius:6px;padding:7px 10px;min-width:0}
  input:focus-visible,select:focus-visible{outline-offset:0;border-color:var(--jade)}

  .app{display:flex;height:100vh}

  /* ---------- sidebar ---------- */
  .sidebar{width:320px;min-width:320px;display:flex;flex-direction:column;background:var(--surface);
    border-right:1px solid var(--line)}
  body.collapsed .sidebar{display:none}
  .brand{display:flex;align-items:center;gap:9px;padding:16px 18px 10px;font-weight:600;font-size:15px}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
  .brand .dot.ok{background:var(--jade)}
  .brand .dot.off{background:var(--brick)}
  .tabs{display:flex;padding:0 18px;border-bottom:1px solid var(--line)}
  .tabs button{background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;
    padding:8px 2px;margin-right:20px;color:var(--ink2);font-weight:500;font-size:13.5px}
  .tabs button:hover{color:var(--ink)}
  .tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--jade);font-weight:600}
  .searchrow{display:flex;gap:8px;padding:12px 14px 4px}
  .searchrow input{flex:1}
  .list{flex:1;overflow-y:auto;padding:6px 0}
  .row{display:grid;grid-template-columns:42px 1fr;gap:12px;padding:10px 18px;cursor:pointer;
    border-bottom:1px solid var(--line);position:relative;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
  .row:hover{background:var(--raised)}
  .row[aria-current=true]{background:var(--raised);box-shadow:inset 3px 0 0 var(--jade)}
  .row img,.row .nocover{width:42px;height:58px;border-radius:3px;object-fit:cover;background:var(--cell-empty)}
  .row .t{font-weight:600;font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden}
  .row .m{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .meter{height:3px;background:var(--cell-empty);margin-top:6px;border-radius:2px;overflow:hidden}
  .row .meter i{display:block;height:100%;background:var(--jade)}
  .moreBox{padding:12px 18px 18px}
  .moreBox .btn{width:100%}
  .hint{padding:22px 18px;color:var(--ink3);font-size:13px}
  .hint strong{display:block;color:var(--ink2);margin-bottom:2px}

  /* ---------- main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-bottom:1px solid var(--line);
    background:var(--surface);flex:0 0 auto}
  .crumb{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .topbar .grow{flex:1}
  .pill{display:inline-flex;align-items:center;gap:8px;max-width:340px;padding:4px 12px;border-radius:20px;
    border:1px solid var(--amber);background:var(--amber-wash);font-size:12.5px;cursor:pointer;color:var(--ink)}
  .pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill i{width:7px;height:7px;border-radius:50%;background:var(--amber);flex:0 0 auto}
  .mainscroll{flex:1;overflow-y:auto}
  .mainscroll.reading{padding:0}
  .page{max-width:980px;margin:0 auto;padding:28px 32px 72px}
  .empty{max-width:420px;margin:18vh auto 0;padding:0 24px;color:var(--ink2)}
  .empty h2{font:600 24px/1.25 var(--serif);color:var(--ink);margin:0 0 8px}
  .empty p{margin:0}

  .head{display:grid;grid-template-columns:132px 1fr;gap:26px;margin-bottom:30px}
  .head .cover{width:132px;height:184px;border-radius:4px;object-fit:cover;background:var(--cell-empty)}
  .head h1{font:600 30px/1.2 var(--serif);margin:0 0 6px;letter-spacing:-.01em}
  .head .author{color:var(--ink2);margin-bottom:12px}
  .facts{display:flex;flex-wrap:wrap;gap:4px 22px;color:var(--ink2);font-size:13px;margin-bottom:12px}
  .facts b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .facts .st::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;
    background:var(--amber);vertical-align:1px}
  .facts .st.full::before{background:var(--jade)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .tags span{font-size:12px;padding:2px 8px;border-radius:4px;border:1px solid var(--line2);color:var(--ink2)}
  .desc{color:var(--ink2);font-size:13.5px;max-width:70ch;white-space:pre-wrap;max-height:4.7em;overflow:hidden}
  .desc.open{max-height:none}
  .desc-toggle{background:none;border:none;padding:0;margin-top:4px;color:var(--jade);cursor:pointer;font-size:13px}

  h3.sec{font:600 16px/1.3 var(--ui);margin:0 0 12px;display:flex;align-items:baseline;gap:12px}
  h3.sec .aside{margin-left:auto;font-weight:400;font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}

  /* ---------- bản đồ chương ---------- */
  .ledger{background:var(--raised);border:1px solid var(--line2);border-radius:6px}
  .ledger-head{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  .ledger-head .range{font:600 24px/1.2 var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .ledger-head .sub{color:var(--ink2);font-size:13px;font-variant-numeric:tabular-nums}
  .mapwrap{max-height:312px;overflow-y:auto;padding:10px 12px 8px}
  #mapCanvas{display:block;cursor:crosshair;touch-action:pan-y}
  .ledger-foot{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:8px 16px 10px;border-top:1px solid var(--line);
    font-size:12px;color:var(--ink3)}
  .ledger-foot .readout{margin-left:auto;color:var(--ink2);font-variant-numeric:tabular-nums}
  .key{display:inline-flex;align-items:center;gap:6px}
  .key i{width:10px;height:10px;border-radius:2px;display:inline-block}

  .rangebar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;margin-top:14px}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:12.5px;color:var(--ink2)}
  .fld input,.fld select{width:96px}
  .presets{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:1px}
  .rangebar .grow{flex:1}
  .actions{display:flex;gap:8px;align-items:center}
  details.opts{margin-top:12px;font-size:13px;color:var(--ink2)}
  details.opts summary{cursor:pointer;width:max-content}
  .optsrow{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;padding:12px 0 0}
  .check{display:flex;align-items:center;gap:8px;padding-bottom:7px}
  .note{margin-top:10px;font-size:12.5px;color:var(--ink3)}

  /* ---------- job ---------- */
  #jobBox{margin-top:18px}
  .job{border:1px solid var(--line2);border-left:3px solid var(--amber);border-radius:6px;background:var(--raised);padding:14px 16px}
  .job[data-status=done]{border-left-color:var(--jade)}
  .job[data-status=error]{border-left-color:var(--brick)}
  .job[data-status=stopped]{border-left-color:var(--ink3)}
  .job-top{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
  .job-top strong{font-weight:600}
  .job-top .state{margin-left:auto;font-size:12.5px;color:var(--ink2)}
  .bar{height:6px;border-radius:3px;background:var(--cell-empty);overflow:hidden;margin-bottom:10px}
  .bar i{display:block;height:100%;width:0;background:var(--jade);transition:width .3s}
  .job-meta{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .job-meta b{color:var(--ink);font-weight:600}
  .job details{margin-top:10px;font-size:12.5px;color:var(--ink2)}
  .job summary{cursor:pointer;width:max-content}
  .job pre{margin:8px 0 0;max-height:150px;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);
    font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap}
  .job pre .e{color:var(--brick)} .job pre .w{color:var(--amber)}

  /* ---------- danh sách chương ---------- */
  .chapters{margin-top:34px}
  .chtools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
  .seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
  .seg button{background:var(--raised);border:none;padding:6px 14px;cursor:pointer;font-weight:500;font-size:13px;color:var(--ink2)}
  .seg button+button{border-left:1px solid var(--line2)}
  .seg button[aria-selected=true]{background:var(--jade-wash);color:var(--ink);font-weight:600}
  .chtools .grow{flex:1}
  .chlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 18px;max-height:400px;overflow-y:auto;
    background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:4px 14px}
  .chi{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;
    background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;min-width:0}
  .chi:hover .ti{color:var(--jade)}
  .chi .n{color:var(--ink3);min-width:34px;font-variant-numeric:tabular-nums}
  .chi .ti{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chi .got{margin-left:auto;color:var(--jade);font-size:12px;flex:0 0 auto}
  .pager{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--ink2)}
  .pager input{width:84px}
  .exports{display:flex;gap:8px;align-items:center}
  .exports span{font-size:12.5px;color:var(--ink3)}

  /* ---------- đọc truyện ---------- */
  #reader{--r-bg:var(--paper);--r-fg:var(--ink);--r-mute:var(--ink3);--r-line:var(--line);
    min-height:100%;background:var(--r-bg);color:var(--r-fg)}
  #reader[data-tone="paper"]{--r-bg:#f1e9d6;--r-fg:#2a2519;--r-mute:#85795d;--r-line:#d8cdb0}
  #reader[data-tone="night"]{--r-bg:#0b0f0d;--r-fg:#c5cec8;--r-mute:#6a7770;--r-line:#1d2622}
  .rbar{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 20px;
    background:var(--r-bg);border-bottom:1px solid var(--r-line)}
  .rbar .grow{flex:1}
  .rbar .btn{background:transparent;border-color:var(--r-line);color:var(--r-fg)}
  .rbar .btn:hover:not(:disabled){border-color:var(--r-mute)}
  .rbar select{background:transparent;border-color:var(--r-line);color:var(--r-fg);padding:5px 8px}
  .rbar select option{color:#000}
  .rbody{max-width:34em;margin:0 auto;padding:44px 24px 80px}
  .rbody .where{color:var(--r-mute);font-size:13px;margin-bottom:6px}
  .rbody h2{font:600 1.55em/1.3 var(--serif);margin:0 0 30px;font-size:calc(var(--fs,18px) * 1.5)}
  .rbody .text{font:400 var(--fs,18px)/1.85 var(--serif)}
  .rbody .text p{margin:0 0 1.05em}
  .rfoot{display:flex;gap:10px;justify-content:space-between;margin-top:44px;padding-top:20px;border-top:1px solid var(--r-line)}
  .rfoot .btn{background:transparent;border-color:var(--r-line);color:var(--r-fg)}

  .toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:99}
  .toast div{background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:6px;font-size:13px;max-width:360px}
  .toast div.err{background:var(--brick);color:#fff}

  @media (max-width:820px){
    .sidebar{position:fixed;inset:0;width:auto;min-width:0;z-index:20;display:none}
    body.nav-open .sidebar{display:flex}
    .page{padding:20px 16px 56px}
    .head{grid-template-columns:96px 1fr;gap:16px}
    .head .cover{width:96px;height:134px}
    .head h1{font-size:23px}
    .ledger-head .range{font-size:20px}
    .rbody{padding:28px 18px 60px}
  }
  @media (prefers-reduced-motion:reduce){ .bar i{transition:none} }
</style>
</head>
<body class="nav-open">
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Danh sách truyện">
    <div class="brand"><span class="dot" id="statusDot" title="Đang kiểm tra kết nối"></span>TYT Crawl</div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="list" aria-selected="true">Khám phá</button>
      <button role="tab" data-tab="search" aria-selected="false">Tìm kiếm</button>
      <button role="tab" data-tab="local" aria-selected="false">Đã tải</button>
    </div>
    <div class="searchrow" id="searchRow" hidden>
      <input id="q" type="search" placeholder="Tên truyện, rồi nhấn Enter" autocomplete="off" aria-label="Tìm truyện theo tên">
      <button class="btn primary" id="btnSearch" style="padding:7px 14px">Tìm</button>
    </div>
    <div class="list" id="storyList"><div class="hint">Đang tải danh sách…</div></div>
    <div class="moreBox" id="moreBox" hidden><button id="btnMore" class="btn">Xem thêm truyện</button></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="btn quiet sm" id="btnNav" aria-label="Ẩn hoặc hiện danh sách truyện">Danh sách</button>
      <div class="crumb" id="crumb"></div>
      <div class="grow"></div>
      <button class="pill" id="jobPill" hidden><i></i><span id="jobPillText"></span></button>
      <button class="btn quiet sm" id="btnTheme" title="Đổi giao diện sáng/tối"></button>
    </div>
    <div class="mainscroll" id="mainScroll">
      <div class="empty" id="emptyState">
        <h2>Chưa chọn truyện nào</h2>
        <p>Chọn một truyện ở danh sách bên trái. Bạn có thể tải cả truyện hoặc kéo chọn đúng khoảng chương cần.</p>
      </div>
      <div id="detail" hidden></div>
      <div id="reader" hidden></div>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const fmt = n => (n==null ? "" : Number(n).toLocaleString("vi-VN"));
const cover = u => u ? "/cover?u=" + encodeURIComponent(u) : "";
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} },
};
const isMobile = () => matchMedia("(max-width:820px)").matches;

const state = {
  tab: "list", offset: 0, count: 24, keyword: "",
  story: null, openToken: 0,
  localChapters: [], have: new Set(),
  range: {start: 0, end: 0}, toDownload: 0, drag: null, hover: 0,
  listMode: "local", apiStart: 1, apiChapters: [],
  job: null, jobId: null, poll: null, pollN: 0,
  reading: null, scrollBeforeRead: 0,
  prefs: {size: +store.get("read-size", 18), tone: store.get("read-tone", "auto")},
};

/* ---------------- toast ---------------- */
function toast(msg, kind=""){
  const d = document.createElement("div");
  if (kind === "err") d.className = "err";
  d.textContent = msg;
  $("#toast").appendChild(d);
  setTimeout(() => d.remove(), 4200);
}

/* ---------------- api ---------------- */
async function request(url, opts){
  const r = await fetch(url, opts);
  let j;
  try { j = await r.json(); } catch(e){ throw new Error("Máy chủ trả về dữ liệu lỗi"); }
  if (!j.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j.data;
}
function api(path, params){
  const url = new URL(path, location.origin);
  for (const [k,v] of Object.entries(params||{})) if (v != null) url.searchParams.set(k, v);
  return request(url);
}
const post = (path, body) => request(path, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body||{})});

/* ---------------- giao diện sáng/tối ---------------- */
function applyTheme(t){
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  $("#btnTheme").textContent = "Giao diện: " + ({auto:"tự động", light:"sáng", dark:"tối"}[t]);
  store.set("theme", t);
  drawMap();
}
$("#btnTheme").onclick = () => {
  const order = ["auto", "light", "dark"];
  applyTheme(order[(order.indexOf(store.get("theme", "auto")) + 1) % 3]);
};
matchMedia("(prefers-color-scheme:dark)").addEventListener("change", () => drawMap());

/* ---------------- thanh bên ---------------- */
function showSidebar(on){
  if (isMobile()){ document.body.classList.toggle("nav-open", on); }
  else document.body.classList.toggle("collapsed", !on);
}
$("#btnNav").onclick = () => {
  const open = isMobile() ? document.body.classList.contains("nav-open") : !document.body.classList.contains("collapsed");
  showSidebar(!open);
};

function rowHtml(s, local){
  const id = local ? s.story_id : s.id;
  const img = s.cover ? `<img src="${cover(s.cover)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<span class="nocover"></span>`;
  let meta, meter = "";
  if (local){
    meta = `${fmt(s.have)}/${fmt(s.chapter_count)} chương, ${(s.bytes/1048576).toFixed(1)} MB`;
    const pct = s.chapter_count ? Math.min(100, s.have / s.chapter_count * 100) : 0;
    meter = `<div class="meter"><i style="width:${pct.toFixed(1)}%"></i></div>`;
  } else meta = `${fmt(s.chapter_count)} chương`;
  const current = state.story && state.story.id === id ? ' aria-current="true"' : "";
  return `<button class="row" data-id="${esc(id)}"${current}>${img}<div style="min-width:0">
    <div class="t">${esc(s.title)}</div>
    <div class="m">${esc(s.author || "Chưa rõ tác giả")}</div>
    <div class="m">${meta}</div>${meter}</div></button>`;
}
function bindRows(box){
  $$(".row", box).forEach(r => r.onclick = () => { openStory(r.dataset.id); if (isMobile()) showSidebar(false); });
}
function renderList(items, append){
  const box = $("#storyList");
  if (!append) box.innerHTML = "";
  if (!items.length && !append){
    box.innerHTML = `<div class="hint"><strong>Không có kết quả</strong>Thử từ khóa ngắn hơn hoặc bỏ dấu.</div>`;
    return;
  }
  box.insertAdjacentHTML("beforeend", items.map(s => rowHtml(s, false)).join(""));
  bindRows(box);
}
async function loadList(reset){
  if (reset) state.offset = 0;
  if (state.tab === "search" && !state.keyword){
    $("#storyList").innerHTML = `<div class="hint"><strong>Tìm truyện</strong>Nhập tên truyện rồi nhấn Enter.</div>`;
    $("#moreBox").hidden = true;
    return;
  }
  const path = state.tab === "search" ? "/api/search" : "/api/list";
  const items = await api(path, {count: state.count, offset: state.offset, keyword: state.keyword});
  renderList(items, !reset);
  state.offset += items.length;
  $("#moreBox").hidden = items.length < state.count;
  const dot = $("#statusDot"); dot.className = "dot ok"; dot.title = "Đã kết nối API TYT";
}
async function loadLocal(){
  const items = await api("/api/local");
  const box = $("#storyList");
  $("#moreBox").hidden = true;
  if (!items.length){
    box.innerHTML = `<div class="hint"><strong>Chưa tải truyện nào</strong>Mở tab Khám phá, chọn một truyện rồi bấm Tải.</div>`;
    return;
  }
  box.innerHTML = items.map(s => rowHtml(s, true)).join("");
  bindRows(box);
}
$$(".tabs button").forEach(b => b.onclick = () => {
  $$(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  state.tab = b.dataset.tab;
  $("#searchRow").hidden = state.tab !== "search";
  const run = state.tab === "local" ? loadLocal() : loadList(true);
  run.catch(e => toast(e.message, "err"));
});
const doSearch = () => { state.keyword = $("#q").value.trim(); loadList(true).catch(e => toast(e.message, "err")); };
$("#btnSearch").onclick = doSearch;
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
$("#btnMore").onclick = () => loadList(false).catch(e => toast(e.message, "err"));

/* ---------------- khung nhìn ---------------- */
function showView(name){
  $("#emptyState").hidden = name !== "empty";
  $("#detail").hidden = name !== "detail";
  $("#reader").hidden = name !== "reader";
  $("#mainScroll").classList.toggle("reading", name === "reader");
}

/* ---------------- chi tiết truyện ---------------- */
async function openStory(id){
  const token = ++state.openToken;
  showView("detail");
  $("#detail").innerHTML = `<div class="page"><p class="hint" style="padding:0">Đang tải thông tin truyện…</p></div>`;
  $$(".row").forEach(r => r.toggleAttribute("aria-current", r.dataset.id === id));
  let s, local;
  try {
    [s, local] = await Promise.all([
      api("/api/story", {id}),
      api("/api/local_chapters", {id}).catch(() => []),
    ]);
  } catch(e){
    if (token !== state.openToken) return;
    $("#detail").innerHTML = `<div class="page"><div class="empty" style="margin-top:8vh"><h2>Không mở được truyện</h2><p>${esc(e.message)}</p></div></div>`;
    return;
  }
  if (token !== state.openToken) return;
  state.story = s;
  setLocal(local);
  state.listMode = local.length ? "local" : "toc";
  initRange();
  $("#crumb").textContent = s.title;
  $("#mainScroll").scrollTop = 0;
  renderDetail(s);
  loadApiPage(1);
  if (state.job && state.job.story_id === s.id) renderJob(state.job);
  syncButtons();
}

function setLocal(list){
  state.localChapters = list;
  state.have = new Set(list.map(c => c.number));
}

function download(format){

/* ---------------- khoảng chương ---------------- */
const N = () => (state.story ? state.story.chapter_count : 0);

function firstMissing(from=1){
  for (let i = from; i <= N(); i++) if (!state.have.has(i)) return i;
  return 0;
}
function initRange(){
  const n = N();
  if (!n){ state.range = {start: 0, end: 0}; return; }
  const fm = firstMissing();
  state.range = fm ? {start: fm, end: Math.min(fm + 99, n)} : {start: 1, end: Math.min(100, n)};
}
function setRange(a, b, syncInputs=true){
  const n = N(); if (!n) return;
  a = clamp(Math.round(a), 1, n); b = clamp(Math.round(b), a, n);
  state.range = {start: a, end: b};
  if (syncInputs){ const f = $("#inFrom"), t = $("#inTo"); if (f) f.value = a; if (t) t.value = b; }
  updateRangeUI(); drawMap();
}
function rangeStats(){
  const {start, end} = state.range; let have = 0;
  for (let i = start; i <= end; i++) if (state.have.has(i)) have++;
  const count = Math.max(0, end - start + 1);
  return {count, have, missing: count - have};
}
function fmtDur(sec){
  if (sec < 60) return "dưới 1 phút";
  if (sec < 3600) return `khoảng ${Math.round(sec / 60)} phút`;
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  return `khoảng ${h} giờ${m ? " " + m + " phút" : ""}`;
}
function updateRangeUI(){
  const t = $("#rangeTitle"); if (!t) return;
  const {start, end} = state.range;
  const st = rangeStats();
  const skip = $("#inResume").checked;
  state.toDownload = skip ? st.missing : st.count;
  t.textContent = start === end ? `Chương ${fmt(start)}` : `Chương ${fmt(start)} – ${fmt(end)}`;
  const delay = +$("#inDelay").value || 1;
  let sub = `${fmt(st.count)} chương`;
  if (st.have) sub += `, đã có ${fmt(st.have)}`;
  if (state.toDownload) sub += `, tải ${fmt(state.toDownload)} chương mất ${fmtDur(state.toDownload * (delay + 0.4))}`;
  else sub += ", không còn gì để tải";
  $("#rangeSub").textContent = sub;
  $("#haveAside").textContent = `Đã tải ${fmt(state.localChapters.length)} / ${fmt(N())} chương`;
  $("#mapCanvas").setAttribute("aria-label", `Bản đồ chương, đang chọn chương ${start} đến ${end}`);
  syncButtons();
}
function syncButtons(){
  const b = $("#btnDownload"); if (!b) return;
  const running = state.job && state.job.status === "running";
  const same = running && state.story && state.job.story_id === state.story.id;
  $("#btnStop").hidden = !same;
  b.hidden = same;
  b.textContent = state.toDownload ? `Tải ${fmt(state.toDownload)} chương` : "Đã đủ chương";
  b.disabled = !!running || !state.toDownload;
  b.title = running && !same ? "Đang tải truyện khác. Hãy dừng hoặc đợi tải xong." : "";
  const has = state.localChapters.length > 0;
  $("#btnTxt").disabled = !has; $("#btnJsonl").disabled = !has;
}
function bindRange(){
  const from = $("#inFrom"), to = $("#inTo");
  const live = () => {
    const a = +from.value, b = +to.value;
    if (a >= 1 && b >= a && b <= N()) setRange(a, b, false);
  };
  const settle = () => {
    let a = +from.value || 1, b = +to.value || a;
    if (b < a) [a, b] = [b, a];
    setRange(a, b);
  };
  from.oninput = to.oninput = live;
  from.onchange = to.onchange = settle;
  $("#inResume").onchange = $("#inDelay").onchange = updateRangeUI;
  $("#pNext").onclick = () => { const f = firstMissing() || 1; setRange(f, f + 99); };
  $("#pMissing").onclick = () => { const f = firstMissing(); f ? setRange(f, N()) : toast("Bạn đã tải đủ cả truyện."); };
  $("#pAll").onclick = () => setRange(1, N());
  $("#btnDownload").onclick = startDownload;
  $("#btnStop").onclick = stopJob;
  from.value = state.range.start; to.value = state.range.end;
  initMap();
  updateRangeUI();
}

/* ---------------- bản đồ chương (canvas) ---------------- */
const M = {cols: 100, cell: 6, rh: 9, gut: 46, W: 0, rows: 1, ro: null};

function initMap(){
  const wrap = $("#mapWrap"), cvs = $("#mapCanvas");
  M.W = 0;
  layoutMap();
  if (M.ro) M.ro.disconnect();
  M.ro = new ResizeObserver(() => layoutMap());
  M.ro.observe(wrap);

  const at = e => {
    const r = cvs.getBoundingClientRect();
    const col = clamp(Math.floor((e.clientX - r.left - M.gut) / M.cell), 0, M.cols - 1);
    const row = Math.max(0, Math.floor((e.clientY - r.top) / M.rh));
    return clamp(row * M.cols + col + 1, 1, N());
  };
  cvs.onpointerdown = e => {
    if (e.button !== 0) return;
    const n = at(e);
    cvs.setPointerCapture(e.pointerId);
    state.drag = {anchor: e.shiftKey && state.range.start ? state.range.start : n};
    setRange(Math.min(state.drag.anchor, n), Math.max(state.drag.anchor, n));
  };
  cvs.onpointermove = e => {
    const n = at(e);
    if (state.drag) setRange(Math.min(state.drag.anchor, n), Math.max(state.drag.anchor, n));
    if (n !== state.hover){ state.hover = n; drawMap(); readout(n); }
  };
  cvs.onpointerup = cvs.onpointercancel = () => { state.drag = null; };
  cvs.onpointerleave = () => { if (!state.drag){ state.hover = 0; drawMap(); readout(0); } };
}
function layoutMap(){
  const wrap = $("#mapWrap"), cvs = $("#mapCanvas"); if (!wrap || !cvs) return;
  const W = wrap.clientWidth - 24; if (W <= 0 || W === M.W) return;
  M.W = W;
  const n = N(), avail = W - M.gut;
  M.cols = Math.min(avail >= 520 ? 100 : avail >= 260 ? 50 : 25, Math.max(n, 1));
  M.cell = Math.min(avail / M.cols, 22);
  M.rh = clamp(M.cell, 10, 22);
  M.rows = Math.ceil(n / M.cols);
  const dpr = window.devicePixelRatio || 1, h = Math.ceil(M.rows * M.rh) + 1;
  cvs.width = Math.round(W * dpr); cvs.height = Math.round(h * dpr);
  cvs.style.width = W + "px"; cvs.style.height = h + "px";
  cvs.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);
  drawMap();
}
function drawMap(){
  const cvs = $("#mapCanvas"); if (!cvs || !state.story || !M.W) return;
  const ctx = cvs.getContext("2d");
  const cs = getComputedStyle(document.documentElement);
  const c = k => cs.getPropertyValue(k).trim();
  const [empty, jade, amber, skip, ink, ink3] = ["--cell-empty", "--jade", "--amber", "--cell-skip", "--ink", "--ink3"].map(c);
  const n = N(), {start, end} = state.range;
  const running = state.job && state.job.status === "running" && state.job.story_id === state.story.id;
  const current = running && state.job.current ? state.job.current.number : 0;
  ctx.clearRect(0, 0, M.W, M.rows * M.rh + 2);
  ctx.font = `10px ${getComputedStyle(document.body).fontFamily}`;
  ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.fillStyle = ink3;
  const every = Math.max(1, Math.ceil(13 / M.rh));  // nhãn hàng thưa ra khi hàng thấp, tránh chồng chữ
  for (let r = 0; r < M.rows; r += every) ctx.fillText(fmt(r * M.cols + 1), M.gut - 10, r * M.rh + M.rh / 2);
  const g = 1, w = Math.max(1, M.cell - g), h = Math.max(1, M.rh - g);
  for (let i = 0; i < n; i++){
    const num = i + 1;
    const x = M.gut + (i % M.cols) * M.cell, y = Math.floor(i / M.cols) * M.rh;
    const have = state.have.has(num), sel = num >= start && num <= end;
    ctx.fillStyle = sel ? (have ? skip : amber) : (have ? jade : empty);
    ctx.fillRect(x, y, w, h);
    if (num === current){ ctx.fillStyle = ink; ctx.fillRect(x, y, w, h); }
  }
  if (state.hover){
    const i = state.hover - 1;
    ctx.strokeStyle = ink; ctx.lineWidth = 1.5;
    ctx.strokeRect(M.gut + (i % M.cols) * M.cell - .5, Math.floor(i / M.cols) * M.rh - .5, M.cell + g - .5, M.rh + g - .5);
  }
}
function readout(n){
  const el = $("#mapReadout"); if (!el) return;
  if (!n){ el.textContent = "Kéo trên bản đồ để chọn khoảng chương"; return; }
  const running = state.job && state.job.status === "running" && state.job.story_id === state.story.id;
  const now = running && state.job.current && state.job.current.number === n;
  el.textContent = `Chương ${fmt(n)}: ${now ? "đang tải" : state.have.has(n) ? "đã tải" : "chưa tải"}`;
}

/* ---------------- danh sách chương ---------------- */
function setListMode(mode){
  state.listMode = mode;
  $("#segLocal").setAttribute("aria-selected", mode === "local");
  $("#segToc").setAttribute("aria-selected", mode === "toc");
  $("#paneLocal").hidden = mode !== "local";
  $("#paneToc").hidden = mode !== "toc";
}
const shortTitle = t => (t || "").replace(/^Chương\s*\d+\s*[:.\-–]?\s*/i, "");
function renderLocalList(){
  const box = $("#paneLocal"); if (!box) return;
  const list = state.localChapters;
  const cc = $("#localCount"); if (cc) cc.textContent = `(${fmt(list.length)})`;
  if (!list.length){
    box.innerHTML = `<div class="chlist"><div class="hint" style="grid-column:1/-1;padding:18px 0"><strong>Chưa tải chương nào</strong>Chọn khoảng chương ở trên rồi bấm Tải.</div></div>`;
    return;
  }
  const prev = $(".chlist", box), top = prev ? prev.scrollTop : 0;
  box.innerHTML = `<div class="chlist">${list.map(c => `<button class="chi" data-n="${c.number}">
      <span class="n">${c.number}</span><span class="ti">${esc(shortTitle(c.title))}</span></button>`).join("")}</div>`;
  $(".chlist", box).scrollTop = top;
  $$(".chi", box).forEach(el => el.onclick = () => openChapter(+el.dataset.n));
}
async function loadApiPage(start){
  const box = $("#paneToc"); if (!box) return;
  const n = N();
  if (!n){ box.innerHTML = ""; return; }
  start = clamp(start, 1, n);
  const end = Math.min(start + 99, n);
  box.innerHTML = `<div class="chlist"><div class="hint" style="grid-column:1/-1;padding:18px 0">Đang tải mục lục…</div></div>`;
  const id = state.story.id;
  try {
    const items = [];
    for (let s = start; s <= end; s += 50){
      const part = await api("/api/chapters", {id, start: s, end: Math.min(s + 49, end)});
      items.push(...part);
    }
    if (!state.story || state.story.id !== id) return;
    state.apiStart = start; state.apiChapters = items;
    renderToc(start, end);
  } catch(e){
    box.innerHTML = `<div class="chlist"><div class="hint" style="grid-column:1/-1;padding:18px 0"><strong>Không tải được mục lục</strong>${esc(e.message)}</div></div>`;
  }
}
function renderToc(start, end){
  const box = $("#paneToc"), n = N();
  box.innerHTML = `
    <div class="chlist">${state.apiChapters.map(c => {
      const got = state.have.has(c.number);
      return `<button class="chi" data-n="${c.number}" title="${got ? "Mở để đọc" : "Chọn để tải"}">
        <span class="n">${c.number}</span>
        <span class="ti">${esc(shortTitle(c.title))}</span>${got ? `<span class="got">đã tải</span>` : ""}</button>`;
    }).join("")}</div>
    <div class="pager">
      <button class="btn sm" id="tocPrev" ${start <= 1 ? "disabled" : ""}>100 chương trước</button>
      <button class="btn sm" id="tocNext" ${end >= n ? "disabled" : ""}>100 chương sau</button>
      <span>Chương ${fmt(start)}–${fmt(end)} / ${fmt(n)}</span>
      <span style="margin-left:auto">Đi tới chương</span>
      <input id="tocJump" type="number" min="1" max="${n}" aria-label="Đi tới chương số">
      <button class="btn sm" id="tocGo">Đi</button>
    </div>`;
  $$(".chi", box).forEach(el => el.onclick = () => {
    const num = +el.dataset.n;
    if (state.have.has(num)) openChapter(num);
    else { setRange(num, num); $("#mapWrap").scrollIntoView({behavior: "smooth", block: "center"}); toast(`Đã chọn chương ${num}. Bấm Tải để lấy chương này.`); }
  });
  $("#tocPrev").onclick = () => loadApiPage(start - 100);
  $("#tocNext").onclick = () => loadApiPage(start + 100);
  const go = () => { const v = +$("#tocJump").value; if (v >= 1) loadApiPage(Math.floor((v - 1) / 100) * 100 + 1); };
  $("#tocGo").onclick = go;
  $("#tocJump").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}
async function refreshLocal(force){
  const s = state.story; if (!s) return;
  try {
    const list = await api("/api/local_chapters", {id: s.id});
    if (!state.story || state.story.id !== s.id) return;
    if (!force && list.length === state.localChapters.length) return;
    setLocal(list);
    renderLocalList(); updateRangeUI(); drawMap();
    if (!$("#paneToc").hidden && state.apiChapters.length) renderToc(state.apiStart, state.apiStart + state.apiChapters.length - 1);
  } catch(e){ /* thử lại ở lần sau */ }
}

/* ---------------- đọc truyện ---------------- */
function readerPrefs(){
  const r = $("#reader");
  r.dataset.tone = state.prefs.tone;
  r.style.setProperty("--fs", state.prefs.size + "px");
}
async function openChapter(number){
  const s = state.story; if (!s) return;
  if (!state.have.has(number)){ toast(`Chương ${number} chưa được tải.`, "err"); return; }
  let c;
  try { c = await api("/api/read", {id: s.id, number}); }
  catch(e){ toast(e.message, "err"); return; }
  if (!state.reading) state.scrollBeforeRead = $("#mainScroll").scrollTop;
  state.reading = number;
  showView("reader");
  const idx = state.localChapters.findIndex(x => x.number === number);
  const prev = idx > 0 ? state.localChapters[idx - 1].number : null;
  const next = idx >= 0 && idx < state.localChapters.length - 1 ? state.localChapters[idx + 1].number : null;
  const paras = (c.content || "").split(/\n+/).map(t => t.trim()).filter(Boolean).map(t => `<p>${esc(t)}</p>`).join("")
    || "<p>Chương này không có nội dung.</p>";
  const title = c.title || `Chương ${number}`;
  $("#reader").innerHTML = `
    <div class="rbar">
      <button class="btn sm" id="rBack">Về trang truyện</button>
      <div class="grow"></div>
      <button class="btn sm" id="rSmaller" aria-label="Giảm cỡ chữ">A−</button>
      <button class="btn sm" id="rBigger" aria-label="Tăng cỡ chữ">A+</button>
      <select id="rTone" aria-label="Nền đọc">
        <option value="auto">Nền theo giao diện</option><option value="paper">Nền giấy</option><option value="night">Nền tối</option>
      </select>
    </div>
    <article class="rbody">
      <div class="where">${esc(s.title)}, chương ${fmt(number)} / ${fmt(s.chapter_count)}</div>
      <h2>${esc(title)}</h2>
      <div class="text">${paras}</div>
      <div class="rfoot">
        <button class="btn" id="rPrev" ${prev == null ? "disabled" : ""}>Chương trước</button>
        <button class="btn" id="rNext" ${next == null ? "disabled" : ""}>Chương sau</button>
      </div>
    </article>`;
  $("#rTone").value = state.prefs.tone;
  readerPrefs();
  $("#rBack").onclick = backToDetail;
  $("#rPrev").onclick = () => prev != null && openChapter(prev);
  $("#rNext").onclick = () => next != null && openChapter(next);
  $("#rSmaller").onclick = () => setSize(state.prefs.size - 1);
  $("#rBigger").onclick = () => setSize(state.prefs.size + 1);
  $("#rTone").onchange = e => { state.prefs.tone = e.target.value; store.set("read-tone", e.target.value); readerPrefs(); };
  $("#crumb").textContent = `${s.title} / ${title}`;
  $("#mainScroll").scrollTop = 0;
}
function setSize(v){
  state.prefs.size = clamp(v, 14, 28);
  store.set("read-size", state.prefs.size);
  readerPrefs();
}
function backToDetail(){
  state.reading = null;
  showView("detail");
  $("#mainScroll").scrollTop = state.scrollBeforeRead;
  if (state.story) $("#crumb").textContent = state.story.title;
  layoutMap(); drawMap();
}
document.addEventListener("keydown", e => {
  if (!state.reading || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === "ArrowLeft"){ const b = $("#rPrev"); if (b && !b.disabled) b.click(); }
  else if (e.key === "ArrowRight"){ const b = $("#rNext"); if (b && !b.disabled) b.click(); }
  else if (e.key === "Escape") backToDetail();
});

/* ---------------- tải chương ---------------- */
async function startDownload(){
  const s = state.story; if (!s || !state.toDownload) return;
  const {start, end} = state.range;
  try {
    const r = await post("/api/crawl", {
      story_id: s.id, title: s.title,
      start_chapter: start, end_chapter: end,
      delay: Number($("#inDelay").value || 1),
      retries: Number($("#inRetries").value || 6),
      resume: $("#inResume").checked,
    });
    toast(`Đã bắt đầu tải chương ${fmt(start)}–${fmt(end)}.`);
    pollJob(r.job_id);
  } catch(e){ toast(e.message, "err"); }
}
async function stopJob(){
  const id = state.job && state.job.id; if (!id) return;
  try { await post("/api/stop", {job_id: id}); } catch(e){ toast(e.message, "err"); }
}
function pollJob(id){
  if (state.poll) clearInterval(state.poll);
  state.jobId = id; state.pollN = 0;
  const tick = async () => {
    let job;
    try { job = await api("/api/job", {id: state.jobId}); } catch(e){ return; }
    if (!job){ clearInterval(state.poll); state.poll = null; return; }
    state.job = job;
    const here = state.story && state.story.id === job.story_id;
    renderJob(job); updatePill(job); syncButtons();
    if (here && job.status === "running"){
      drawMap();
      if (++state.pollN % 3 === 0) refreshLocal(false);
    }
    if (job.status !== "running"){
      clearInterval(state.poll); state.poll = null;
      if (here) await refreshLocal(true);
      if (state.tab === "local") loadLocal().catch(() => {});
      const label = `chương ${job.start_chapter}–${job.end_chapter}`;
      if (job.status === "done") toast(`Tải xong ${label}: thêm ${fmt(job.written)} chương mới.`);
      else if (job.status === "stopped") toast(`Đã dừng tải. Đã lấy thêm ${fmt(job.written)} chương.`);
      else toast(`Tải lỗi: ${job.message || "xem nhật ký"}`, "err");
    }
  };
  tick();
  state.poll = setInterval(tick, 900);
}
function updatePill(job){
  const pill = $("#jobPill"), running = job.status === "running";
  pill.hidden = !running;
  if (!running) return;
  $("#jobPillText").textContent = `Đang tải ${job.title || job.story_id}: ${fmt(job.have)}/${fmt(job.total)}`;
  pill.onclick = () => { if (!state.story || state.story.id !== job.story_id){ state.reading = null; openStory(job.story_id); } else if (state.reading) backToDetail(); };
}
function renderJob(job){
  const box = $("#jobBox"); if (!box) return;
  if (!state.story || job.story_id !== state.story.id){ box.innerHTML = ""; return; }
  if (!box.firstElementChild || box.firstElementChild.dataset.job !== job.id){
    const range = job.end_chapter ? `Chương ${fmt(job.start_chapter)} – ${fmt(job.end_chapter)}` : "Đang chuẩn bị";
    box.innerHTML = `
    <div class="job" data-job="${esc(job.id)}">
      <div class="job-top"><strong id="jbTitle">${esc(range)}</strong><span class="state" id="jbState"></span></div>
      <div class="bar"><i id="jbBar"></i></div>
      <div class="job-meta"><span id="jbCount"></span><span id="jbNow"></span><span id="jbEta"></span></div>
      <details id="jbDetails"><summary>Nhật ký <span id="jbErr"></span></summary><pre id="jbLog"></pre></details>
    </div>`;
  }
  const el = box.firstElementChild;
  el.dataset.status = job.status;
  if (job.end_chapter) $("#jbTitle").textContent = `Chương ${fmt(job.start_chapter)} – ${fmt(job.end_chapter)}`;
  $("#jbState").textContent = {running: "Đang tải", done: "Hoàn tất", error: "Lỗi", stopped: "Đã dừng"}[job.status] || job.status;
  const total = job.total || 0;
  const pct = total ? Math.min(100, job.have / total * 100) : 0;
  $("#jbBar").style.width = pct.toFixed(1) + "%";
  $("#jbCount").innerHTML = `Đã có <b>${fmt(job.have)}</b> / ${fmt(total)} chương, lần này thêm <b>${fmt(job.written)}</b>`;
  $("#jbNow").innerHTML = job.status === "running" && job.current ? `Đang lấy chương <b>${fmt(job.current.number)}</b>` : "";
  let eta = "";
  if (job.status === "running" && job.written > 0){
    const elapsed = Date.now() / 1000 - job.started;
    const left = Math.max(0, total - job.have) / (job.written / elapsed);
    eta = `Còn ${fmtDur(left)}`;
  }
  $("#jbEta").textContent = eta;
  $("#jbErr").textContent = job.errors.length ? `(${job.errors.length} lỗi)` : "";
  const log = $("#jbLog"), atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 8;
  log.innerHTML = job.log.slice(-60).map(l => {
    const cls = l.startsWith("⚠") || l.startsWith("✖") ? "e" : (l.startsWith("⏳") ? "w" : "");
    return `<span class="${cls}">${esc(l)}</span>`;
  }).join("\n");
  if (atEnd) log.scrollTop = log.scrollHeight;
}

/* ---------------- khởi động ---------------- */
(async () => {
  applyTheme(store.get("theme", "auto"));
  if (!isMobile()) document.body.classList.remove("nav-open");
  showView("empty");
  try {
    const cfg = await api("/api/config");
    if (cfg.active_job) pollJob(cfg.active_job);
  } catch(e){
    const dot = $("#statusDot"); dot.className = "dot off"; dot.title = "Không kết nối được máy chủ";
    toast("Không kết nối được máy chủ: " + e.message, "err");
  }
  loadList(true).catch(e => {
    const dot = $("#statusDot"); dot.className = "dot off"; dot.title = "Không gọi được API TYT";
    $("#storyList").innerHTML = `<div class="hint"><strong>Không tải được danh sách</strong>${esc(e.message)}</div>`;
  });
})();
</script>
